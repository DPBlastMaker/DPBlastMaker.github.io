<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    var path = window.location.pathname.replace(/^\/|\/$/g, '')
    if (path && !path.includes('.')) {
      window.location.replace('/viewer.html?slug=' + encodeURIComponent(path))
    } else {
      document.title = '404 — Not Found'
      document.body.innerHTML = [
        '<div style="text-align:center;padding:80px 20px;font-family:sans-serif">',
        '<h1 style="font-weight:300;font-size:2.5rem;margin-bottom:8px">404</h1>',
        '<p style="color:#757575;margin-bottom:24px">Page not found</p>',
        '<a href="/" style="background:#1976D2;color:#fff;padding:10px 24px;border-radius:2px;text-decoration:none;display:inline-block;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;font-size:0.875rem;font-family:sans-serif">Go Home</a>',
        '</div>'
      ].join('')
    }
  </script>
</head>
<body style="margin:0"></body>
</html>
