<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPBlast Host ┃ Admin</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">DPBlast Host</a>
      <nav>
        <span class="text-muted text-sm" id="adminUsername"></span>
        <a href="/" class="btn btn-outline btn-sm">Home</a>
        <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
      </nav>
    </div>
  </header>

  <div class="container page">
    <h1 class="page-title">Admin Panel</h1>

    <div class="admin-grid">
      <div class="glass">
        <div class="admin-section-title">Create User</div>
        <form id="createUserForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="newUsername" placeholder="e.g. creator1" required />
          </div>
          <div class="form-group">
            <label>Temporary Password</label>
            <input type="text" id="newPassword" placeholder="e.g. TempPass123" required />
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="newRole">
              <option value="creator">Creator</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div id="createUserMsg" class="msg"></div>
          <button type="submit" class="btn btn-primary">Create User</button>
        </form>
      </div>

      <div class="glass">
        <div class="admin-section-title">Users</div>
        <div id="usersList"></div>
      </div>
    </div>

    <div class="glass mt-24">
      <div class="flex-between mb-16">
        <div class="admin-section-title" style="margin-bottom:0;">All DP Blasts</div>
      </div>
      <div id="blastsList"></div>
    </div>
  </div>

  <button id="darkToggle" title="Toggle dark mode" style="
    position:fixed;bottom:20px;right:20px;z-index:998;
    width:44px;height:44px;border-radius:50%;border:2px solid var(--divider);
    background:var(--bg-card);color:var(--text-primary);cursor:pointer;
    font-size:1.25rem;box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:center;
    transition:var(--transition);
  ">🌙</button>

  <style>
    body.dark #darkToggle { border-color: var(--divider); background: var(--bg-card); }
  </style>

  <script src="js/dark.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
