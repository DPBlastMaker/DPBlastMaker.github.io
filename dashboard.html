<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPBlast Host ┃ Dashboard</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">DPBlast Host</a>
      <nav>
        <span class="text-muted text-sm" id="username"></span>
        <a href="admin.html" id="adminLink" class="btn btn-outline btn-sm" style="display:none">Admin</a>
        <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
      </nav>
    </div>
  </header>

  <div class="container page">
    <div class="flex-between mb-24">
      <h1 class="page-title" style="margin-bottom:0">My DP Blasts</h1>
      <a href="create.html" class="btn btn-primary">+ New Blast</a>
    </div>
    <div id="blastsContainer"><div class="spinner"></div></div>
  </div>

  <button id="darkToggle" title="Toggle dark mode" style="
    position:fixed;bottom:20px;right:20px;z-index:998;
    width:44px;height:44px;border-radius:50%;border:2px solid var(--divider);
    background:var(--bg-card);color:var(--text-primary);cursor:pointer;
    font-size:1.25rem;box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:center;
    transition:var(--transition);
  ">🌙</button>

  <style>
    body.dark #darkToggle { border-color: var(--divider); background: var(--bg-card); }
  </style>

  <script src="js/dark.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
