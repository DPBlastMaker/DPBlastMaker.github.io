<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPBlast Host ┃ Dashboard</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">DPBlast Host</a>
      <nav>
        <span class="text-muted text-sm" id="username"></span>
        <a href="index.html" class="btn btn-outline btn-sm">Home</a>
        <a href="admin.html" id="adminLink" class="btn btn-outline btn-sm" style="display:none">Admin</a>
        <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
      </nav>
    </div>
  </header>

  <div class="container page">
    <div class="flex-between mb-24">
      <h1 class="page-title" style="margin-bottom:0">My DP Blasts</h1>
      <a href="create.html" class="btn btn-primary">+ New Blast</a>
    </div>
    <div id="blastsContainer"><div class="spinner"></div></div>
  </div>

  <div id="editModal" class="modal-overlay" style="display:none">
    <div class="modal glass" style="max-width:480px">
      <h2>Edit Blast</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="editTitle" style="width:100%" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="editDesc" rows="3" style="width:100%;padding:8px 0;background:transparent;border:none;border-bottom:1px solid var(--divider);color:var(--text-primary);font-size:1rem;outline:none;font-family:inherit;resize:vertical"></textarea>
      </div>
      <div id="editMsg" class="msg"></div>
      <div class="flex gap-8">
        <button class="btn btn-primary" id="editSaveBtn">Save</button>
        <button class="btn btn-outline" id="editCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <button id="darkToggle" title="Toggle dark mode" style="
    position:fixed;bottom:20px;right:20px;z-index:998;
    width:44px;height:44px;border-radius:50%;border:2px solid var(--divider);
    background:var(--bg-card);color:var(--text-primary);cursor:pointer;
    font-size:1.25rem;box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:center;
    transition:var(--transition);
  ">🌙</button>

  <style>
    body.dark #darkToggle { border-color: var(--divider); background: var(--bg-card); }
    .modal-overlay {
      position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;
      background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .modal { padding:24px; width:100%; }
    #editModal .form-group { margin-bottom:16px; }
    #editModal label { display:block; margin-bottom:4px; font-size:0.85rem; font-weight:600; color:var(--text-secondary); }
    #editTitle { padding:8px 0; border:none; border-bottom:1px solid var(--divider); background:transparent; color:var(--text-primary); font-size:1rem; outline:none; }
  </style>

  <script src="js/dark.js?v=1"></script>
  <script src="js/supabase.js?v=1"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/dashboard.js?v=1"></script>
</body>
</html>
